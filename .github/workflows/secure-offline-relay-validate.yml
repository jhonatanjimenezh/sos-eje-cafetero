name: Secure offline relay validate

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/secure-envelope/**'
      - 'infrastructure/aws/**'
      - 'infrastructure/onprem/**'
      - 'docker-compose.yml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/secure-offline-relay-validate.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/secure-envelope/**'
      - 'infrastructure/aws/**'
      - 'infrastructure/onprem/**'
      - 'docker-compose.yml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/secure-offline-relay-validate.yml'

permissions:
  contents: read

jobs:
  secure-sync:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: sos
          POSTGRES_USER: sos
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sos -d sos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://sos:test-only-password@127.0.0.1:5432/sos
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspace dependencies
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm install --no-frozen-lockfile
      - name: Validate database migrations
        run: pnpm --filter @sos/api migrate
      - name: Typecheck API
        run: pnpm --filter @sos/api lint
      - name: Build API
        run: pnpm --filter @sos/api build
      - name: Generate ephemeral CI sync keys
        run: |
          mkdir -p "$RUNNER_TEMP/sos-sync-keys"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/sos-sync-keys/encryption.pem"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/sos-sync-keys/receipt.pem"
          chmod 600 "$RUNNER_TEMP/sos-sync-keys/"*.pem
      - name: Start API with local key adapter
        env:
          PORT: '3101'
          FEATURE_SECURE_ENVELOPE: 'true'
          SYNC_KEY_MODE: LOCAL_PEM
          SYNC_ENCRYPTION_PRIVATE_KEY_PATH: ${{ runner.temp }}/sos-sync-keys/encryption.pem
          SYNC_RECEIPT_SIGNING_PRIVATE_KEY_PATH: ${{ runner.temp }}/sos-sync-keys/receipt.pem
          SYNC_ENCRYPTION_KEY_PUBLIC_ID: ci-encryption-v1
          SYNC_RECEIPT_SIGNING_KEY_PUBLIC_ID: ci-receipt-v1
          SYNC_MAX_ENVELOPE_TTL_SECONDS: '259200'
          SYNC_MAX_CIPHERTEXT_BYTES: '12288'
          SYNC_MAX_BATCH_SIZE: '4'
          SYNC_BATCH_REQUESTS_PER_MINUTE: '100'
          IDENTITY_HASH_SECRET: ci-only-identity-hash-secret-at-least-32-bytes
        run: |
          pnpm --filter @sos/api start >"$RUNNER_TEMP/secure-sync-api.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/secure-sync-api.pid"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3101/api/v1/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/secure-sync-api.log"
          exit 1
      - name: Secure sync E2E — replay tampering mixed batch signed ACK
        env:
          SYNC_E2E_API: http://127.0.0.1:3101/api/v1
        run: node apps/api/test/secure-sync-e2e.mjs
      - name: Ensure service worker never handles API cache
        run: |
          grep -q "url.pathname.startsWith('/api/')" apps/web/public/sw.js
          grep -q "Never\|Nunca\|nunca" apps/web/public/sw.js
      - name: Typecheck web with secure offline enabled
        env:
          NEXT_PUBLIC_API_URL: /api/v1
          NEXT_PUBLIC_FEATURE_OFFLINE_QUEUE: 'true'
          NEXT_PUBLIC_FEATURE_SECURE_ENVELOPE: 'true'
          NEXT_PUBLIC_FEATURE_WEBRTC_RELAY: 'true'
          NEXT_PUBLIC_FEATURE_LIVENESS: 'false'
          NEXT_PUBLIC_LIVENESS_PROVIDER: MANUAL
        run: pnpm --filter @sos/web lint
      - name: Build web with secure offline enabled
        env:
          NEXT_PUBLIC_API_URL: /api/v1
          NEXT_PUBLIC_FEATURE_OFFLINE_QUEUE: 'true'
          NEXT_PUBLIC_FEATURE_SECURE_ENVELOPE: 'true'
          NEXT_PUBLIC_FEATURE_WEBRTC_RELAY: 'true'
          NEXT_PUBLIC_FEATURE_LIVENESS: 'false'
          NEXT_PUBLIC_LIVENESS_PROVIDER: MANUAL
        run: pnpm --filter @sos/web build
      - name: Validate on-prem key generator syntax
        run: node --check infrastructure/onprem/scripts/generate-sync-keys.mjs
      - name: Build API image from monorepo
        run: docker build -f apps/api/Dockerfile .
      - name: Build web image from monorepo
        run: >-
          docker build -f apps/web/Dockerfile
          --build-arg NEXT_PUBLIC_API_URL=/api/v1
          --build-arg NEXT_PUBLIC_FEATURE_OFFLINE_QUEUE=true
          --build-arg NEXT_PUBLIC_FEATURE_SECURE_ENVELOPE=true
          --build-arg NEXT_PUBLIC_FEATURE_WEBRTC_RELAY=true
          .
      - name: Print API logs on failure
        if: failure()
        run: cat "$RUNNER_TEMP/secure-sync-api.log" || true
      - name: Stop API
        if: always()
        run: |
          test ! -f "$RUNNER_TEMP/secure-sync-api.pid" || kill "$(cat "$RUNNER_TEMP/secure-sync-api.pid")" >/dev/null 2>&1 || true
