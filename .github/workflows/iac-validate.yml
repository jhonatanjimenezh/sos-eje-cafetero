name: IaC validate

on:
  pull_request:
    paths:
      - 'infrastructure/**'
      - 'apps/api/Dockerfile'
      - 'apps/web/Dockerfile'
      - 'apps/api/src/database/**'
      - 'apps/api/scripts/migrate.mjs'
      - '.github/workflows/iac-validate.yml'
  push:
    branches: [main]
    paths:
      - 'infrastructure/**'
      - '.github/workflows/iac-validate.yml'

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.0'
      - name: Terraform format
        run: terraform fmt -check -recursive infrastructure/aws
      - name: Validate bootstrap
        working-directory: infrastructure/aws/bootstrap
        run: |
          terraform init -backend=false
          terraform validate
      - name: Validate platform
        working-directory: infrastructure/aws/platform
        run: |
          terraform init -backend=false
          terraform validate

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate root Compose
        run: docker compose --env-file .env.example config >/dev/null
      - name: Validate on-prem Compose
        working-directory: infrastructure/onprem
        run: |
          cp .env.example .env
          docker compose --env-file .env config >/dev/null
