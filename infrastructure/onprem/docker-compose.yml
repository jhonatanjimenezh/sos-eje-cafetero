name: sos-eje-cafetero

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sos}
      POSTGRES_USER: ${POSTGRES_USER:-sos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sos} -d ${POSTGRES_DB:-sos}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [backend]

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [backend]

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c '
      mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
      mc mb --ignore-existing local/$${PRIVATE_EVIDENCE_BUCKET} &&
      mc anonymous set none local/$${PRIVATE_EVIDENCE_BUCKET} &&
      exit 0'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      PRIVATE_EVIDENCE_BUCKET: ${PRIVATE_EVIDENCE_BUCKET:-sos-private-evidence}
    networks: [backend]

  api:
    build:
      context: ../../apps/api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-sos}
      DB_USER: ${POSTGRES_USER:-sos}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SSL: "false"
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      PRIVATE_EVIDENCE_BUCKET: ${PRIVATE_EVIDENCE_BUCKET:-sos-private-evidence}
      IDENTITY_HASH_SECRET: ${IDENTITY_HASH_SECRET:?IDENTITY_HASH_SECRET required}
      ALLOW_LEGACY_COMMAND_TOKEN: ${ALLOW_LEGACY_COMMAND_TOKEN:-true}
      COMMAND_CENTER_TOKEN: ${COMMAND_CENTER_TOKEN:?COMMAND_CENTER_TOKEN required}
      FEATURE_PUBLIC_SOS: ${FEATURE_PUBLIC_SOS:-true}
      FEATURE_OPERATIONAL_CENTER: ${FEATURE_OPERATIONAL_CENTER:-true}
      FEATURE_AFFECTED_IDENTITY: ${FEATURE_AFFECTED_IDENTITY:-false}
      FEATURE_LIVENESS: ${FEATURE_LIVENESS:-false}
      FEATURE_ASSISTANCE_MATCHING: ${FEATURE_ASSISTANCE_MATCHING:-false}
      FEATURE_WHATSAPP: ${FEATURE_WHATSAPP:-false}
      FEATURE_WEBRTC_RELAY: ${FEATURE_WEBRTC_RELAY:-false}
      FEATURE_OPERATIONAL_LAYERS: ${FEATURE_OPERATIONAL_LAYERS:-false}
      FEATURE_SECURE_ENVELOPE: ${FEATURE_SECURE_ENVELOPE:-false}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [backend, edge]

  web:
    build:
      context: ../../apps/web
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_FEATURE_OFFLINE_QUEUE: ${NEXT_PUBLIC_FEATURE_OFFLINE_QUEUE:-false}
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-https://demotiles.maplibre.org/style.json}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
    networks: [edge]

networks:
  backend:
    internal: true
  edge:

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddy_data:
  caddy_config:
